name: Build & Release APK

# Every push to main builds a new APK with an automatically increased version
# (versionCode = run number, versionName = MAJOR.MINOR.<run number>) and publishes
# it as a GitHub Release you can download straight to your phone.
on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compute version
        id: version
        run: |
          MAJOR=$(grep -E '^major=' version.properties | cut -d= -f2 | tr -d '[:space:]')
          MINOR=$(grep -E '^minor=' version.properties | cut -d= -f2 | tr -d '[:space:]')
          BUILD=${{ github.run_number }}
          echo "code=$BUILD" >> "$GITHUB_OUTPUT"
          echo "name=$MAJOR.$MINOR.$BUILD" >> "$GITHUB_OUTPUT"
          echo "Building version $MAJOR.$MINOR.$BUILD (code $BUILD)"

      # Keeps the same signing key between builds so new versions install as updates.
      # Used only when no KEYSTORE_BASE64 secret is configured.
      - name: Restore fallback signing key
        if: env.KEYSTORE_BASE64 == ''
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: obdroar-debug-keystore-v1

      - name: Decode release keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleRelease -PbuildNumber=${{ steps.version.outputs.code }}
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/OBDRoar-v${{ steps.version.outputs.name }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OBDRoar-v${{ steps.version.outputs.name }}
          path: dist/*.apk

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: OBD Roar v${{ steps.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          make_latest: true
          files: dist/*.apk
          body: |
            📱 **Install:** download `OBDRoar-v${{ steps.version.outputs.name }}.apk` below on your Android phone and open it
            (allow "install unknown apps" for your browser if asked).

            Commit: ${{ github.sha }}
